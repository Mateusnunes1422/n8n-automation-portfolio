name: Farol — build do APK

on:
  push:
    paths:
      - "farol-android/**"
      - ".github/workflows/farol-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: farol-android

    steps:
      - uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: farol-android

      - name: Rodar os testes do leitor de ofertas
        run: ./gradlew test --stacktrace

      - name: Compilar o APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Renomear o APK
        run: cp app/build/outputs/apk/debug/app-debug.apk farol.apk

      - name: Publicar o APK como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: farol-apk
          path: farol-android/farol.apk
          if-no-files-found: error

      # Publica também como Release, pra dar um link direto que abre no celular.
      - name: Publicar release "farol-latest"
        if: github.ref_name == 'claude/rota-pro-free-app-2j3zql' || github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete farol-latest --yes --cleanup-tag || true
          gh release create farol-latest farol.apk \
            --title "Farol — última versão" \
            --notes "APK do Farol gerado automaticamente a partir do commit ${GITHUB_SHA::7}.

          Baixe o \`farol.apk\` no celular e instale (é preciso permitir a instalação de fontes desconhecidas).
          Se já tiver uma versão instalada, desinstale antes de atualizar."
